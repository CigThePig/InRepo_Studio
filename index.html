<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>InRepo Studio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1220;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0d1220;
      z-index: 9999;
      transition: opacity 0.4s ease-out, visibility 0.4s;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 80%;
      max-width: 320px;
    }

    .loading-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .loading-subtitle {
      font-size: 0.875rem;
      color: #aab0d4;
      margin-bottom: 24px;
      text-align: center;
      min-height: 1.2rem;
      font-weight: 500;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background-color: #16213e;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: #3b82f6;
      border-radius: 4px;
      transition: width 0.2s ease-out;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="loading-container">
        <h1 class="loading-title">InRepo Studio</h1>
        <p class="loading-subtitle" id="loading-text">Initializing engine...</p>
        <div class="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/boot/main.ts"></script>
</body>
</html>
